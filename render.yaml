# Render Blueprint for the realtime (multiplayer) server. The campus site itself is on Vercel.
# In Render: New → Blueprint → pick this repo. Then set ALLOWED_ORIGINS to the Vercel URL.
services:
  - type: web
    name: life-at-alu-realtime
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: WS_PORT=$PORT npx tsx server/index.ts
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      # Signs the saved sign-ins kept in each browser; Render makes a random one once and keeps it.
      - key: SESSION_SECRET
        generateValue: true
      # Demo mode: sign-in codes are shown on screen instead of emailed. Set to 0 once email is set up.
      - key: DEMO_CODES
        value: "1"
      # Postgres for accounts, XP and leaderboards (Supabase free plan: the Session pooler
      # connection string). Without it, everything is forgotten when the free server sleeps.
      - key: DATABASE_URL
        sync: false
